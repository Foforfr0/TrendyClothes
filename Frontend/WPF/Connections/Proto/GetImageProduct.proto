syntax = "proto3";

option csharp_namespace = "GetImageProduct";

package getimageproduct;

service GetImageService {
  rpc GetImage (GetImageRequest) returns (GetImageReply);
}

message GetImageRequest {
  int32 product_id = 1;
}

message GetImageReply {
  bytes image_data = 1;
  string image_type = 2;
}